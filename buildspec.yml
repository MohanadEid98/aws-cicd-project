version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=us-east-1
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      - echo Building backend image...
      - docker build -t task-backend ./backend
      - echo Building frontend image...
      - docker build -t task-frontend ./frontend

  post_build:
    commands:
      - echo Tagging images...
      - docker tag task-backend:latest $ECR_REGISTRY/task-backend:latest
      - docker tag task-frontend:latest $ECR_REGISTRY/task-frontend:latest
      - echo Pushing backend image...
      - docker push $ECR_REGISTRY/task-backend:latest
      - echo Pushing frontend image...
      - docker push $ECR_REGISTRY/task-frontend:latest