version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: "75397111983"
    BACKEND_REPOSITORY: task-backend
    FRONTEND_REPOSITORY: task-frontend
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo Building Backend Docker image...
      - docker build -t $BACKEND_REPOSITORY:$IMAGE_TAG ./backend
      - docker tag $BACKEND_REPOSITORY:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPOSITORY:$IMAGE_TAG

      - echo Building Frontend Docker image...
      - docker build -t $FRONTEND_REPOSITORY:$IMAGE_TAG ./frontend
      - docker tag $FRONTEND_REPOSITORY:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPOSITORY:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Backend image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPOSITORY:$IMAGE_TAG

      - echo Pushing Frontend image...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPOSITORY:$IMAGE_TAG

      - echo Creating imagedefinitions.json...
      - printf '[{"name":"task-frontend","imageUri":"%s"}]' $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPOSITORY:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json